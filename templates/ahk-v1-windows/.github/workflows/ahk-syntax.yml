name: AHK syntax

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AutoHotkey v1.1
        shell: pwsh
        run: |
          choco install autohotkey --version=1.1.37.02 -y
          echo "C:\Program Files\AutoHotkey" >> $env:GITHUB_PATH
      - name: Syntax check
        shell: pwsh
        run: |
          # EDIT: set your main script path
          $script = "GridMove.ahk"
          if (-not (Test-Path $script)) { throw "Missing $script" }
          # AutoHotkey exits non-zero on syntax errors when using /ErrorStdOut
          & "AutoHotkeyU64.exe" /ErrorStdOut "$script"
